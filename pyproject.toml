[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "els-risk"
version = "0.1.0"
description = "Weekly data pipeline for ELS index risk research"
requires-python = ">=3.11"
dependencies = ["pandas==2.2.3", "numpy==2.1.3", "requests==2.32.3"]

[project.optional-dependencies]
dev = ["pytest==8.3.5"]
model = ["lightgbm==4.6.0"]
explain = ["shap>=0.46,<1"]
app = ["streamlit>=1.40,<2", "fastapi>=0.115,<1", "uvicorn>=0.32,<1"]

[project.scripts]
els = "els.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
